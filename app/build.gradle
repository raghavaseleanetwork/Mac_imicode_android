// 1. Plugins Block MUST be at the very top (Line 1)
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'com.google.gms.google-services'
}

// 2. Imports come AFTER plugins
import java.util.Properties
import java.io.FileInputStream

// Create a variable to hold the properties
def localProperties = new Properties()

// Load the file if it exists
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

// Helper function to safely quote string values for BuildConfig
def safeQuote(value) {
    if (value == null) return "\"\""
    def cleanValue = value.toString().replaceAll("^\"|\"\$", "")
    return "\"${cleanValue}\""
}

android {
    namespace = "com.sdk.glassessdksample"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.aselea.imiglass"
        minSdk = 24
        targetSdk = 35
        versionCode = 20
        versionName = "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary = true
        }

        // Inject API keys from local.properties
        buildConfigField("String", "GEMINI_API_KEY", safeQuote(localProperties["GEMINI_API_KEY"] ?: "YOUR_GEMINI_API_KEY_HERE"))
        buildConfigField("String", "OPENAI_API_KEY", safeQuote(localProperties["OPENAI_API_KEY"] ?: ""))
        buildConfigField("String", "PICOVOICE_ACCESS_KEY", safeQuote(localProperties["PICOVOICE_ACCESS_KEY"] ?: ""))
        buildConfigField("String", "GMAIL_CLIENT_ID", safeQuote(localProperties["GMAIL_CLIENT_ID"] ?: "YOUR_GMAIL_CLIENT_ID_HERE"))
    }

    signingConfigs {
        release {
            storeFile rootProject.file(localProperties["KEYSTORE_FILE"] ?: "app/imi_release.keystore")
            storePassword localProperties["KEYSTORE_PASSWORD"] ?: "imi123"
            keyAlias localProperties["KEY_ALIAS"] ?: "imi_key"
            keyPassword localProperties["KEY_PASSWORD"] ?: "imi123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
        }
    }

    packagingOptions {
        exclude "META-INF/DEPENDENCIES"
        exclude "META-INF/INDEX.LIST"
        exclude "META-INF/AL2.0"
        exclude "META-INF/LGPL2.1"

        // 16 KB page-size support (required for Android 15+ / Play Store).
        // Keep native libs uncompressed and page-aligned in the APK so the
        // 16 KB-aligned .so files (incl. the patched glasses SDK codecs) load
        // correctly on devices with 16 KB memory pages.
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {

    // Smart Glass AAR File
    implementation files("libs/LIB_GLASSES_SDK-release_3.aar")

    // Core Android Libraries
    implementation libs.androidx.core.ktx
    implementation "com.google.android.material:material:1.12.0"
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation "androidx.viewpager2:viewpager2:1.0.0"

    // Permissions
    implementation "com.github.getActivity:XXPermissions:20.0"

    // EventBus
    implementation "org.greenrobot:eventbus:3.2.0"

    // Loading Dialog
    implementation "com.github.ForgetAll:LoadingDialog:v1.1.2"

    // RecyclerView Helper
    implementation "com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4"

    // JSON Parser
    implementation "com.google.code.gson:gson:2.10.1"

    // Latest OkHttp (WebSocket Stable)
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Java-WebSocket for Gemini Live API
    implementation "org.java-websocket:Java-WebSocket:1.5.3"

    // Google AI SDK for Android
    implementation "com.google.ai.client.generativeai:generativeai:0.9.0"

    // Gmail API Integration (Simplified - using REST API)
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Glide - Image loading library
    implementation "com.github.bumptech.glide:glide:4.15.1"
    annotationProcessor "com.github.bumptech.glide:compiler:4.15.1"

    // ========================================================================
    // WAKE WORD DETECTION - Choose ONE option:
    // ========================================================================
    
    // OPTION 1: ONNX Runtime for Custom "Hey IMI" Wake Word (RECOMMENDED - No API Key needed!)
    // Models required in assets/models/:
    // - melspectrogram.onnx
    // - embedding_model.onnx  
    // - hey_imi_model.onnx
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.22.0"
    implementation "com.github.wendykierp:JTransforms:3.1"
    
    // OPTION 2: Picovoice Porcupine (Comment out if using ONNX)
    // Requires PICOVOICE_ACCESS_KEY in local.properties
    implementation "ai.picovoice:porcupine-android:4.0.0"

    // OPTION 3: Snowboy (optional)
    // Drop Snowboy SDK artifacts in app/libs with names like snowboy-android.aar
    // and add assets: snowboy/common.res + snowboy/hey_imi.pmdl
    implementation fileTree(dir: "libs", include: ["snowboy*.aar", "snowboy*.jar"])
    
    // ========================================================================

    // Firebase Remote Config (for secure API key storage)
    implementation platform('com.google.firebase:firebase-bom:33.0.0')
    implementation 'com.google.firebase:firebase-config-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
